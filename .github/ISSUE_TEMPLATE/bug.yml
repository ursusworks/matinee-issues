name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Issues are public. Please don't include server addresses, API keys or passwords."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Matinee version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: emby
    attributes:
      label: Emby server version
      placeholder: "4.10.2"
  - type: dropdown
    id: console
    attributes:
      label: Console
      options: [Xbox Series X, Xbox Series S]
  - type: textarea
    id: file
    attributes:
      label: For playback problems
      description: "The file's format, if you know it (e.g. MKV, HEVC, DTS). In the player: ⋯ → Playback info shows it."
